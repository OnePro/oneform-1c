name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: portable
        run: python3 scripts/check_repo_portable.py
      - name: changelog
        run: python3 scripts/check_changelog.py check
      - name: changelog unit tests
        run: python3 -m unittest discover -s scripts/tests -v
      - run: cargo test --locked --no-fail-fast
      - run: cargo clippy --locked --all-targets -- -D warnings
