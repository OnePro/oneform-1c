name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build and publish, for example v0.1.0"
        required: true
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: windows-latest, target: x86_64-pc-windows-msvc, name: windows-x64, exe: oneform.exe }
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, name: linux-x64, exe: oneform }
          - { os: macos-14, target: aarch64-apple-darwin, name: macos-arm64, exe: oneform }
          # Intel build is cross-compiled on the arm64 runner (not run in CI)
          - { os: macos-14, target: x86_64-apple-darwin, name: macos-x64, exe: oneform }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Build
        env:
          # static C runtime on Windows: the exe needs no Visual C++ redistributable
          RUSTFLAGS: ${{ runner.os == 'Windows' && '-C target-feature=+crt-static' || '' }}
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: python3 scripts/package_release.py "target/${{ matrix.target }}/release/${{ matrix.exe }}" "${{ matrix.name }}" --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: oneform-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          cd dist
          cat *.sha256 > SHA256SUMS.txt
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" --repo "$REPO" --clobber *.zip *.tar.gz SHA256SUMS.txt
          else
            gh release create "$TAG" --repo "$REPO" --title "oneform ${TAG#v}" --generate-notes *.zip *.tar.gz SHA256SUMS.txt
          fi
